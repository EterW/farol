[project]
name = "farol"
version = "1.3.0"
description = "Farol: backtest e sinais ao vivo de opções binárias (Deriv) só com evidência estatística, sem promessa."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Uso pessoal / estudo" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "websockets>=14.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
assistente = ["anthropic>=2.9"]   # só para ASSISTENTE_PROVEDOR=anthropic (Ollama não precisa de pacote extra)
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "playwright>=1.45",   # tests/telas.py e ferramentas/gerar_marca.py
    "fonttools>=4.50",    # ferramentas/gerar_marca.py
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["backups", "data", "resultados"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "C4", "RUF"]
ignore = [
    "E741",     # 'l' como nome de linha do ranking é legível neste código
    "RUF001", "RUF002", "RUF003",   # caracteres como ×, –, “ ” são intencionais nos textos em português
    "SIM108",   # ternários longos ficam menos legíveis
    "B905",     # zip sem strict onde os tamanhos são garantidos pela construção
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "B011"]
"tests/telas.py" = ["E501"]          # JavaScript embutido
"ferramentas/*" = ["E501"]           # SVG embutido

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
files = ["binarias"]

[[tool.mypy.overrides]]   # checagem leve: tipos do pandas/numpy viram Any (evita centenas de falsos alarmes)
module = ["pandas", "pandas.*", "numpy", "numpy.*"]
follow_imports = "skip"
